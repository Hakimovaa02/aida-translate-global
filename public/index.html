<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AidaTranslate Global</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="background"></div>

<div class="container">

  <div class="logo-block">
    <h1>AidaTranslate Global</h1>
    <p class="developer">Developed by Prytkova Aida</p>
  </div>

  <div class="translator-card">

    <div class="top-controls">

      <!-- направление перевода -->
      <select id="direction">
        <option value="ru-en">Russian → English</option>
        <option value="en-ru">English → Russian</option>
      </select>

      <!-- стиль английского (UK / US) -->
      <select id="style">
        <option value="uk">🇬🇧 British English</option>
        <option value="us">🇺🇸 American English</option>
        <option value="simple">Simple meaning</option>
      </select>

    </div>

    <!-- ввод -->
    <textarea
      id="input"
      placeholder="Enter text..."
    ></textarea>

    <!-- кнопка -->
    <button onclick="translateText()">
      Translate
    </button>

    <!-- вывод -->
    <textarea
      id="output"
      readonly
      placeholder="Translation..."
    ></textarea>

    <div class="info-block">
      <h3>Semantic Translation Engine</h3>
      <p>
        Supports idioms, semantic interpretation and UK/US style switching.
      </p>
    </div>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
